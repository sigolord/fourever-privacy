<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FourEver — Privacy Center</title>
  <style>
    :root {
      --bg: #0b0b0e;
      --card-bg: #16161d;
      --card-hover: #1f1f2a;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(99, 102, 241, 0.4);
      --text-primary: #f2f2f7;
      --text-secondary: #9898a0;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .app-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(22, 22, 29, 0.8) 100%);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 16px;
      font-size: 1.8rem;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--accent-light);
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .description {
      color: var(--text-secondary);
      font-size: 0.98rem;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .platform-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px 24px;
      text-decoration: none;
      color: var(--text-primary);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .platform-card:hover {
      background-color: var(--card-hover);
      border-color: var(--card-border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(99, 102, 241, 0.15);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }

    .icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }

    .icon-wrapper svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .card-text h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .card-text p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .arrow {
      color: var(--text-secondary);
      font-size: 1.2rem;
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .platform-card:hover .arrow {
      color: var(--accent-light);
      transform: translateX(4px);
    }

    footer {
      color: var(--text-secondary);
      font-size: 0.88rem;
    }

    footer a {
      color: var(--accent-light);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="app-badge">⏱️</div>
    <h1>FourEver</h1>
    <div class="subtitle">Privacy Center</div>
    <p class="description">Select your platform to view the official Privacy Policy:</p>

    <div class="grid">
      <!-- iOS Card -->
      <a href="./ios/" class="platform-card">
        <div class="card-left">
          <div class="icon-wrapper">

            </svg>
          </div>
          <div class="card-text">
            <h2>FourEver for iOS</h2>
            <p>Apple App Store</p>
          </div>
        </div>
        <span class="arrow">→</span>
      </a>

      <!-- Android Card -->
      <a href="./android/" class="platform-card">
        <div class="card-left">
          <div class="icon-wrapper">
            <!-- Android / Play Store Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.552 0 1 .4482 1 .9993.0001.5511-.448 1-.9999 1m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.552 0 1 .4482 1 .9993 0 .5511-.448 1-.9999 1m11.4045-6.02l1.9973-3.4592c.1506-.2609.0612-.5942-.2-.7448-.2608-.1507-.5943-.0618-.7449.1991l-2.0229 3.5034c-1.551-.7087-3.2982-1.1098-5.1585-1.1098-1.8604 0-3.6076.4011-5.1586 1.1098l-2.0229-3.5034c-.1506-.2609-.4841-.3498-.7449-.1991-.2612.1506-.3506.4839-.2.7448l1.9973 3.4592c-3.1539 1.7161-5.321 4.8872-5.6322 8.6306h23.5186c-.3112-3.7434-2.4783-6.9145-5.6323-8.6306"/>
            </svg>
          </div>
          <div class="card-text">
            <h2>FourEver for Android</h2>
            <p>Google Play Store</p>
          </div>
        </div>
        <span class="arrow">→</span>
      </a>
    </div>

    <footer>
      <p><a href="../">FourEver website</a> · <a href="../support/">Support</a> · <a href="mailto:fourever.support@proton.me">Email</a></p>
    </footer>

  </div>

</body>
</html>
