<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FourEver Timer</title>
  <script>
    (function () {
      var path = location.pathname.replace(/^\/fourever-privacy/, '') || '/';
      path = path.replace(/^\/uk(\/|$)/, '/ua$1')
                 .replace(/\/roadmap(\/|$)/, '/whats-new$1')
                 .replace(/^\/ios(\/|$)/, '/privacy-policy/ios$1');
      location.replace('https://fourever-timer.app' + path + location.search + location.hash);
    })();
  </script>
</head>
<body style="background:#030305;color:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding-top:100px">
  <p>FourEver Timer has moved to <a href="https://fourever-timer.app/" style="color:#f19f51">fourever-timer.app</a></p>
</body>
</html>
